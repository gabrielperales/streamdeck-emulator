name: Desktop app

# Builds the desktop app for macOS (universal), Linux (.deb, AppImage) and
# Windows (.msi, NSIS). Burrito builds every OS's backend on Linux; Tauri then
# builds each shell on its own OS. A v* tag makes a draft release with the
# bundles, described by that version's section of CHANGELOG.md.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "src-tauri/**"
      - "mix.exs"
      - "mix.lock"
      - "config/**"
      - "lib/mix/tasks/desktop.build.ex"
      - "e2e/smoke-sidecar.mjs"
      - ".github/workflows/desktop.yml"
      - ".github/scripts/release-notes.sh"

env:
  RELEASE: streamdeck_emulator_desktop
  TAURI_CLI: "@tauri-apps/cli@2.12.4"

jobs:
  # For a release tag, fail in seconds rather than after the builds when the
  # versions disagree or the changelog has nothing for this version.
  check:
    name: Check release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          mix=$(sed -nE 's/^ *version: "([^"]+)",?$/\1/p' mix.exs | head -1)
          tauri=$(jq -r .version src-tauri/tauri.conf.json)
          cargo=$(sed -nE 's/^version = "([^"]+)"$/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tag=$tag mix.exs=$mix tauri.conf.json=$tauri Cargo.toml=$cargo"
          [ "$tag" = "$mix" ] && [ "$tag" = "$tauri" ] && [ "$tag" = "$cargo" ]
      - name: CHANGELOG.md has this version
        run: .github/scripts/release-notes.sh "$GITHUB_REF_NAME"

  backends:
    name: Backends (Burrito)
    needs: check
    # Runs when check is skipped (not a tag), but not when it fails.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v4

      # Keep in sync with mise.toml. Burrito needs exactly Zig 0.16.0, xz, and
      # 7z for the Windows backend.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.4.14"
          elixir-version: "1.20.4"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: sudo apt-get update && sudo apt-get install -y xz-utils p7zip-full

      - uses: actions/cache@v4
        with:
          path: deps
          key: deps-prod-${{ hashFiles('mix.lock') }}
      - run: mix deps.get

      - name: Build every backend
        run: |
          for target in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-apple-darwin x86_64-apple-darwin; do
            mix desktop.build --sidecar-only --target "$target"
          done
          ls -la burrito_out

      - uses: actions/upload-artifact@v4
        with:
          name: backends
          path: burrito_out/${{ env.RELEASE }}-*
          if-no-files-found: error

  bundle:
    name: Bundle (${{ matrix.name }})
    needs: backends
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
            smoke: universal-apple-darwin
          - name: Linux
            # The oldest supported runner, so the shell links against an old glibc.
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            smoke: x86_64-unknown-linux-gnu
          - name: Windows
            os: windows-2022
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: msi,nsis
            smoke: x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backends
          path: burrito_out

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Join the Mac backends into a universal one
        if: matrix.target == 'universal-apple-darwin'
        run: |
          lipo -create -output "burrito_out/$RELEASE-universal-apple-darwin" \
            "burrito_out/$RELEASE-aarch64-apple-darwin" "burrito_out/$RELEASE-x86_64-apple-darwin"
          lipo -info "burrito_out/$RELEASE-universal-apple-darwin"

      - name: Smoke-test the backend
        shell: bash
        run: |
          chmod +x burrito_out/* || true
          node e2e/smoke-sidecar.mjs "burrito_out/$RELEASE-${{ matrix.smoke }}"

      - name: Build the app
        shell: bash
        run: npx --yes "$TAURI_CLI" build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: .github/scripts/release-notes.sh "$GITHUB_REF_NAME" | tee release-notes.md
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: bundles
      - run: ls -laR bundles
      - uses: softprops/action-gh-release@v2
        with:
          files: bundles/**/*
          draft: true
          name: ${{ github.ref_name }}
          body_path: release-notes.md
